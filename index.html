<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediCare Pulse - Enterprise Online Healthcare SaaS</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            teal: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              300: '#5eead4',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
              950: '#042f2e',
            },
            medical: {
              navy: '#0f172a',
              blue: '#0284c7',
              light: '#f8fafc',
              accent: '#06b6d4',
              surface: '#ffffff'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="h-full font-sans text-slate-800 antialiased selection:bg-teal-500 selection:text-white bg-slate-50 dark:bg-slate-900 dark:text-slate-100 flex flex-col">

  <!-- Top Global Header -->
  <header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm transition-colors duration-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <!-- Left: Brand Logo & Mobile Toggle -->
        <div class="flex items-center space-x-3">
          <button id="mobileMenuBtn" class="lg:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800 focus:outline-none" aria-label="Toggle navigation">
            <i data-lucide="menu" class="w-6 h-6"></i>
          </button>
          
          <div class="flex items-center space-x-2 cursor-pointer" id="logoBtn">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-600 to-cyan-500 flex items-center justify-center text-white shadow-md shadow-teal-500/20">
              <i data-lucide="activity" class="w-6 h-6 stroke-[2.5]"></i>
            </div>
            <div>
              <span class="text-xl font-extrabold bg-gradient-to-r from-teal-700 via-teal-600 to-cyan-600 dark:from-teal-400 dark:to-cyan-400 bg-clip-text text-transparent tracking-tight">MediCare</span>
              <span class="text-xs font-bold px-1.5 py-0.5 rounded-full bg-teal-100 text-teal-800 dark:bg-teal-900/50 dark:text-teal-300 ml-1">Pulse</span>
            </div>
          </div>
        </div>

        <!-- Center: Interactive Role Switcher Selector -->
        <div class="hidden sm:flex items-center bg-slate-100 dark:bg-slate-800/80 p-1.5 rounded-full border border-slate-200/80 dark:border-slate-700">
          <span class="text-xs font-semibold text-slate-500 dark:text-slate-400 pl-3 pr-2 flex items-center gap-1">
            <i data-lucide="user-check" class="w-3.5 h-3.5 text-teal-600 dark:text-teal-400"></i> Role:
          </span>
          <div class="flex space-x-1" id="roleSelectorGroup">
            <button data-role="admin" class="role-btn text-xs font-semibold px-3 py-1.5 rounded-full transition-all duration-200 flex items-center gap-1.5">
              <i data-lucide="shield" class="w-3.5 h-3.5"></i> Admin
            </button>
            <button data-role="doctor" class="role-btn text-xs font-semibold px-3 py-1.5 rounded-full transition-all duration-200 flex items-center gap-1.5">
              <i data-lucide="stethoscope" class="w-3.5 h-3.5"></i> Doctor
            </button>
            <button data-role="patient" class="role-btn text-xs font-semibold px-3 py-1.5 rounded-full transition-all duration-200 flex items-center gap-1.5">
              <i data-lucide="user" class="w-3.5 h-3.5"></i> Patient
            </button>
          </div>
        </div>

        <!-- Right: Actions & Cloud Auth -->
        <div class="flex items-center space-x-2 sm:space-x-4">

          <!-- Cloud Auth Button -->
          <button onclick="showAuthModal()" class="hidden md:flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold text-teal-700 bg-teal-50 hover:bg-teal-100 dark:text-teal-300 dark:bg-teal-950/80 border border-teal-200 dark:border-teal-800 shadow-sm transition">
            <i data-lucide="log-in" class="w-4 h-4 text-teal-600"></i> Cloud Sign In
          </button>

          <!-- Mobile Role Switch Dropdown -->
          <div class="sm:hidden relative">
            <select id="mobileRoleSelect" class="text-xs font-semibold bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1.5 text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500">
              <option value="admin">Admin</option>
              <option value="doctor">Doctor</option>
              <option value="patient">Patient</option>
            </select>
          </div>

          <!-- Notification Bell -->
          <div class="relative" id="notificationsDropdown">
            <button id="notifBtn" class="p-2 rounded-xl text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800 relative transition-colors">
              <i data-lucide="bell" class="w-5 h-5"></i>
              <span id="notifBadge" class="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-rose-500 rounded-full ring-2 ring-white dark:ring-slate-900"></span>
            </button>
            
            <!-- Notifications Popover -->
            <div id="notifPanel" class="hidden absolute right-0 mt-2 w-80 sm:w-96 bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-100 dark:border-slate-700 py-3 z-50 animate-in fade-in slide-in-from-top-2 duration-150">
              <div class="px-4 pb-2 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center">
                <h4 class="text-sm font-bold text-slate-800 dark:text-white flex items-center gap-1.5">
                  <i data-lucide="bell-ring" class="w-4 h-4 text-teal-600"></i> System Alerts
                </h4>
                <button id="clearNotifsBtn" class="text-xs text-teal-600 hover:text-teal-700 dark:text-teal-400 font-medium">Mark all read</button>
              </div>
              <div id="notifList" class="max-h-80 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-700/50">
              </div>
            </div>
          </div>

          <!-- Theme Mode Toggle -->
          <button id="themeToggleBtn" class="p-2 rounded-xl text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800 transition-colors" title="Toggle Light/Dark Theme">
            <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
            <i data-lucide="sun" class="w-5 h-5 block dark:hidden"></i>
          </button>

          <!-- Current Active User Avatar & Info -->
          <div class="flex items-center pl-2 border-l border-slate-200 dark:border-slate-700">
            <div class="w-9 h-9 rounded-full bg-teal-100 dark:bg-teal-900/60 text-teal-700 dark:text-teal-300 font-bold flex items-center justify-center border-2 border-teal-500/30 text-xs shadow-sm" id="userAvatar">
              AD
            </div>
            <div class="hidden lg:block ml-2.5 text-left">
              <div class="text-xs font-bold text-slate-800 dark:text-slate-100 leading-none" id="userName">Administrator</div>
              <div class="text-[11px] text-teal-600 dark:text-teal-400 font-medium mt-0.5" id="userRoleTitle">System Admin</div>
            </div>
          </div>

        </div>

      </div>
    </div>
  </header>

  <!-- Main Container Layout -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-30 w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col justify-between pt-16 lg:pt-0">
      
      <div class="p-4 overflow-y-auto flex-1">
        <!-- Role Specific Section Header -->
        <div class="mb-4 px-3 py-2.5 rounded-xl bg-slate-100/80 dark:bg-slate-800/60 flex items-center space-x-3">
          <div class="p-2 rounded-lg bg-teal-600 text-white shadow-sm" id="sidebarRoleIcon">
            <i data-lucide="shield" class="w-5 h-5"></i>
          </div>
          <div>
            <div class="text-xs font-bold text-slate-800 dark:text-slate-200" id="sidebarRoleName">Admin Dashboard</div>
            <div class="text-[11px] text-slate-500 dark:text-slate-400">Healthcare Operations</div>
          </div>
        </div>

        <!-- Navigation Links Container -->
        <nav class="space-y-1.5" id="sidebarNav">
        </nav>
      </div>

      <!-- Sidebar Footer Info -->
      <div class="p-4 border-t border-slate-100 dark:border-slate-800">
        <div class="bg-gradient-to-br from-teal-50 to-cyan-50 dark:from-slate-800/80 dark:to-teal-950/40 rounded-xl p-3 border border-teal-100 dark:border-teal-900/30">
          <div class="flex items-center space-x-2 text-teal-700 dark:text-teal-300 mb-1">
            <i data-lucide="shield-check" class="w-4 h-4"></i>
            <span class="text-xs font-bold">Cloud Database Sync</span>
          </div>
          <p class="text-[11px] text-slate-500 dark:text-slate-400 leading-snug">Firebase Auth & Realtime Firestore protection.</p>
        </div>
      </div>

    </aside>

    <!-- Sidebar Overlay for Mobile -->
    <div id="sidebarOverlay" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-20 lg:hidden"></div>

    <!-- Main Dynamic Content Area -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 bg-slate-50 dark:bg-slate-950">
      
      <div class="max-w-7xl mx-auto space-y-6" id="mainContent">
      </div>

    </main>

  </div>

  <!-- Shared Modal Dialog Container -->
  <div id="modalBackdrop" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
    <div id="modalContainer" class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-100 dark:border-slate-800 max-w-2xl w-full p-6 sm:p-8 transform transition-all scale-95 opacity-0 duration-200">
      <!-- Modal Header -->
      <div class="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-800">
        <h3 id="modalTitle" class="text-lg font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
        </h3>
        <button id="modalCloseBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Modal Body -->
      <div id="modalBody" class="py-4 space-y-4 max-h-[70vh] overflow-y-auto">
      </div>

      <!-- Modal Footer -->
      <div id="modalFooter" class="pt-4 border-t border-slate-100 dark:border-slate-800 flex justify-end space-x-3">
      </div>
    </div>
  </div>

  <!-- Toast Notification Outlet Container -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 space-y-3 max-w-md w-full pointer-events-none px-4 sm:px-0"></div>

  <!-- JS Modules -->
  <script src="js/firebase-config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/modals.js"></script>
  <script src="js/components/auth-modal.js"></script>
  <script src="js/views/admin.js"></script>
  <script src="js/views/doctor.js"></script>
  <script src="js/views/patient.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
